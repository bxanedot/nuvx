[package]
name = "native-core"
version = "0.1.0"
edition = "2021"
description = "nuvx native core: analyzer + decode/mix playback engine behind one UniFFI boundary (spec sections 2 and 3)."

[lib]
name = "native_core"
crate-type = ["staticlib", "cdylib", "rlib"]





[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]

uniffi = "0.32"
log = "0.4"
env_logger = "0.11"

ebur128 = "=0.1.10"



symphonia = { version = "0.6.1", default-features = false, features = [
  "flac", "mp3", "aac", "alac", "vorbis", "pcm", "wav", "ogg", "isomp4", "mkv", "aiff",
] }




symphonia-adapter-libopus = { version = "0.3", features = ["bundled"] }


cpal = "0.18"



lofty = "0.25"




ureq = { version = "2", features = ["native-tls"] }


crossbeam-channel = "0.5"
rtrb = "0.3"





rten = "0.26"
rten-tensor = "0.26"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cmake = "0.1"
cc = "1"
sha2 = "0.10"
















[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"





[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
