

name: Nuvx
attributes:
  LastUpgradeCheck: "1520"
options:
  createIntermediateGroups: true
  developmentLanguage: en


  knownRegions: [en, de, es, fr, he, hi, id, it, ja, pl, pt-BR, ru, th, tr, vi, zh-Hans, zh-Hant, zh-HK]
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "9"
    NUVX_BUILD_REVISION: "unknown"

    NUVX_UPDATE_FEED_URL: ""
    NUVX_UPDATE_PUBLIC_KEY: ""

    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"


    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

    CODE_SIGN_STYLE: Automatic


    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  Nuvx:
    type: application
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bxane.nuvx
        PRODUCT_NAME: nuvx
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconMonochrome
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

    sources:
      - path: ../../../core/apple/src
        excludes:
          - Generated/**
      - path: ../../../core/apple/resources/Assets.xcassets


      - path: ../../../core/apple/resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../../../core/apple/resources/AppIconMonochrome.icon
        type: file
        buildPhase: resources

      - path: ../../../core/apple/src/Generated
        optional: true
      - path: ../../../core/apple/resources/Resources/Localization
        buildPhase: resources
      - path: ../../../core/apple/resources/Resources/AudioLicenses
        type: folder
        buildPhase: resources
      - path: ../../../core/apple/resources/Resources/YouTubeSolver
        type: folder
        buildPhase: resources
      - path: ../../../core/apple/resources/Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - target: NuvxWidget
        embed: true
      - framework: ../../../core/apple/build/Frameworks/NuvxShared.xcframework
        embed: true
      - framework: ../../../core/apple/build/Frameworks/NativeCoreFFI.xcframework
        embed: true
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: Speech.framework
    info:
      path: Nuvx-Info.plist
      properties:
        CFBundleDisplayName: nuvx
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NuvxRevision: "$(NUVX_BUILD_REVISION)"
        LSApplicationCategoryType: public.app-category.music
        SUFeedURL: "$(NUVX_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(NUVX_UPDATE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bxane.nuvx
            CFBundleURLSchemes: [nuvx]




        NSUserActivityTypes:
          - com.bxane.nuvx.playback
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        NSMotionUsageDescription: nuvx uses headphone motion to keep its spatial effect anchored when you turn your head.
        NSPhotoLibraryAddUsageDescription: nuvx saves the lyric share cards you choose to add to Photos.
        NSSpeechRecognitionUsageDescription: nuvx uses on-device speech recognition to align fetched lyrics with the playing audio. Audio is not sent to a server for alignment.
    entitlements:
      path: Nuvx.entitlements
      properties:





        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.bxane.nuvx

        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
  NuvxWidget:
    type: app-extension
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bxane.nuvx.widget
        PRODUCT_NAME: NuvxWidget
    sources:
      - Sources/Widget
    info:
      path: NuvxWidget-Info.plist
      properties:
        CFBundleDisplayName: nuvx Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NuvxRevision: "$(NUVX_BUILD_REVISION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NuvxWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.bxane.nuvx
