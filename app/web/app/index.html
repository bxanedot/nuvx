<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The extension trusts https://web.nuvx.lol only (web/extension/site.config.ts),
      // so the Pages address goes there before anything loads, keeping its path and query.
      if (location.hostname === 'nuvx.pages.dev') location.replace('https://web.nuvx.lol' + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f9" />
    <title>nuvx Web Player — YouTube Music in your browser</title>
    <meta name="description" content="Play YouTube Music in your browser with nuvx: synced lyrics, Listen Together, Spotify playlists and Discord status. Free and open source." />
    <link rel="canonical" href="https://web.nuvx.lol/" />
    <meta property="og:site_name" content="nuvx" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web.nuvx.lol/" />
    <meta property="og:title" content="nuvx Web Player" />
    <meta property="og:description" content="Play YouTube Music in your browser with nuvx: synced lyrics, Listen Together, Spotify playlists and Discord status. Free and open source." />
    <meta property="og:image" content="https://www.nuvx.lol/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="nuvx Web Player" />
    <meta name="twitter:description" content="Play YouTube Music in your browser with nuvx: synced lyrics, Listen Together, Spotify playlists and Discord status. Free and open source." />
    <meta name="twitter:image" content="https://www.nuvx.lol/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://www.nuvx.lol/ambient.css" />
    <!-- DM Sans is the app's typeface (web/docs/apple-music-dom.md, "Font"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
