name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (e.g. v0.2.0); the release must exist
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

defaults:
  run:
    shell: bash
    working-directory: app/desktop

jobs:
  license-notices:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python3 ../../scripts/test_cargo_notices.py
          python3 ../../scripts/cargo_notices.py --output assets/licenses/cargo-notices.txt
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses/cargo-notices.txt
          if-no-files-found: error

  windows-build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx.exe" "universal/${{ matrix.arch }}/nuvx.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-windows-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  windows:
    needs: [windows-build, license-notices]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-windows-x86_64
          path: app/desktop/target/x86_64-pc-windows-msvc/release
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-windows-aarch64
          path: app/desktop/target/aarch64-pc-windows-msvc/release
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses
      - run: |
          test -s assets/licenses/cargo-notices.txt
          v=${TAG#v}
          choco install innosetup --no-progress -y
          MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$v" windows/nuvx.iss
          installer="windows/Output/nuvx-setup-$v.exe"
          install_dir="$RUNNER_TEMP/nuvx-notice-test"
          "$installer" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=$install_dir"
          test -s "$install_dir/licenses/cargo-notices.txt"
          cmp assets/licenses/cargo-notices.txt "$install_dir/licenses/cargo-notices.txt"
          mv "$installer" "nuvx-setup-$v.exe"
          gh release upload "$TAG" "nuvx-setup-$v.exe" --clobber

  linux-build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx" "universal/${{ matrix.arch }}/nuvx"
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-linux-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  linux:
    needs: [linux-build, license-notices]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-linux-x86_64
          path: app/desktop/universal/x86_64
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-linux-aarch64
          path: app/desktop/universal/aarch64
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses
      - run: |
          test -s assets/licenses/cargo-notices.txt
          v=${TAG#v}
          mkdir -p dist/nuvx
          cp universal/x86_64/nuvx dist/nuvx/nuvx-x86_64
          cp universal/aarch64/nuvx dist/nuvx/nuvx-aarch64
          cp linux/install.sh linux/nuvx.desktop README.md LICENSE dist/nuvx/
          mkdir -p dist/nuvx/licenses
          cp assets/fonts/LICENSE-*.txt dist/nuvx/licenses/
          cp assets/licenses/*.txt dist/nuvx/licenses/
          cp vendor/glib/LICENSE dist/nuvx/licenses/glib-LICENSE.txt
          cp vendor/glib/COPYRIGHT dist/nuvx/licenses/glib-COPYRIGHT.txt
          cp assets/icon/icon.png dist/nuvx/nuvx.png
          chmod 755 dist/nuvx/nuvx-x86_64 dist/nuvx/nuvx-aarch64 dist/nuvx/install.sh
          sh linux/test-installer.sh dist/nuvx
          tar -C dist -cf - nuvx | gzip -9 > "nuvx-setup-$v-linux-universal.tar.gz"
          gh release upload "$TAG" "nuvx-setup-$v-linux-universal.tar.gz" --clobber

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx" "universal/${{ matrix.arch }}/nuvx"
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-macos-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  macos:
    needs: [macos-build, license-notices]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-macos-x86_64
          path: app/desktop/universal/x86_64
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-macos-aarch64
          path: app/desktop/universal/aarch64
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses
      - run: |
          test -s assets/licenses/cargo-notices.txt
          v=${TAG#v}
          for arch in x86_64 aarch64; do
            variant=intel
            [[ "$arch" == aarch64 ]] && variant=apple-silicon
            folder="dmg-$variant"
            sh macos/bundle.sh "universal/$arch/nuvx" "$v" "$folder"
            ln -s /Applications "$folder/Applications"
            installer="nuvx-setup-$v-macos-$variant.dmg"
            hdiutil create -volname "nuvx $variant" -srcfolder "$folder" -format UDZO "$installer"
            gh release upload "$TAG" "$installer" --clobber
          done
