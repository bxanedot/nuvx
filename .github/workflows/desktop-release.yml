name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (e.g. v0.2.0); the release must exist
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

defaults:
  run:
    shell: bash
    working-directory: app/desktop

jobs:
  windows-build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx.exe" "universal/${{ matrix.arch }}/nuvx.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-windows-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  windows:
    needs: windows-build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-windows-x86_64
          path: app/desktop/target/x86_64-pc-windows-msvc/release
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-windows-aarch64
          path: app/desktop/target/aarch64-pc-windows-msvc/release
      - run: |
          v=${TAG#v}
          choco install innosetup --no-progress -y
          MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$v" windows/nuvx.iss
          mv "windows/Output/nuvx-setup-$v.exe" "nuvx-setup-$v.exe"
          gh release upload "$TAG" "nuvx-setup-$v.exe" --clobber

  linux-build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx" "universal/${{ matrix.arch }}/nuvx"
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-linux-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  linux:
    needs: linux-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-linux-x86_64
          path: app/desktop/universal/x86_64
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-linux-aarch64
          path: app/desktop/universal/aarch64
      - run: |
          v=${TAG#v}
          mkdir -p dist/nuvx
          cp universal/x86_64/nuvx dist/nuvx/nuvx-x86_64
          cp universal/aarch64/nuvx dist/nuvx/nuvx-aarch64
          cp linux/install.sh linux/nuvx.desktop README.md dist/nuvx/
          cp -R ../../THIRD_PARTY_LICENSES dist/nuvx/
          cp assets/icon/icon.png dist/nuvx/nuvx.png
          chmod 755 dist/nuvx/nuvx-x86_64 dist/nuvx/nuvx-aarch64 dist/nuvx/install.sh
          sh linux/test-installer.sh dist/nuvx
          tar -C dist -cf - nuvx | gzip -9 > "nuvx-setup-$v-linux-universal.tar.gz"
          gh release upload "$TAG" "nuvx-setup-$v-linux-universal.tar.gz" --clobber

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          test "$TAG" = "v$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx" "universal/${{ matrix.arch }}/nuvx"
      - uses: actions/upload-artifact@v6
        with:
          name: nuvx-macos-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  macos:
    needs: macos-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-macos-x86_64
          path: app/desktop/universal/x86_64
      - uses: actions/download-artifact@v6
        with:
          name: nuvx-macos-aarch64
          path: app/desktop/universal/aarch64
      - run: |
          v=${TAG#v}
          mkdir -p universal dmg
          lipo -create universal/x86_64/nuvx universal/aarch64/nuvx -output universal/nuvx
          lipo universal/nuvx -verify_arch x86_64 arm64
          sh macos/bundle.sh universal/nuvx "$v" dmg
          ln -s /Applications dmg/Applications
          hdiutil create -volname nuvx -srcfolder dmg -format UDZO "nuvx-setup-$v-macos-universal.dmg"
          gh release upload "$TAG" "nuvx-setup-$v-macos-universal.dmg" --clobber
