name: Mobile playback nightlies

on:
  workflow_dispatch:
  schedule:
    - cron: "7 2 * * *"

permissions:
  contents: read

concurrency:
  group: mobile-playback-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - name: Build side-by-side Android playback APKs
        run: bash gradlew :app:assembleDevDebug :tv:assembleDevTvDebug :tv:assembleDevAutoDebug :wearos:assembleDevDebug -Pnuvx.wearDebuggable=true
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/android/mobile/build/outputs/apk/dev/debug/*.apk
            app/android/tv/build/outputs/apk/devTv/debug/*.apk
            app/android/tv/build/outputs/apk/devAuto/debug/*.apk
            app/android/wearos/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/ios/native-core
          key: ios
          cache-on-failure: true
      - name: Install build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Identify Apple SDK for framework cache
        id: apple-sdk
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: apple-frameworks
        with:
          path: |
            core/apple/build/Frameworks
            core/apple/src/Generated
          key: mobile-playback-frameworks-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-sdk.outputs.version }}-${{ hashFiles('app/ios/native-core/**', 'app/ios/shared/**', 'app/ios/vendor/**', 'app/ios/*.kts', 'app/ios/gradle.properties', 'app/ios/gradle/**', 'app/ios/gradlew', 'app/ios/scripts/build-native-core.sh', 'app/ios/scripts/build-shared-framework.sh', 'core/native/**') }}
          restore-keys: |
            apple-frameworks-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-sdk.outputs.version }}-
      - name: Build native and KMP frameworks
        working-directory: app/ios
        env:
          CONFIG: release
          FRAMEWORKS_CACHED: ${{ steps.apple-frameworks.outputs.cache-hit }}
        run: |
          if [[ "$FRAMEWORKS_CACHED" == true ]]; then
            (cd mobile && xcodegen generate --spec project.yml)
          else
            bash scripts/bootstrap-apple.sh
          fi
      - uses: actions/cache/save@v6
        if: steps.apple-frameworks.outputs.cache-hit != 'true'
        with:
          path: |
            core/apple/build/Frameworks
            core/apple/src/Generated
          key: ${{ steps.apple-frameworks.outputs.cache-primary-key }}
      - name: Package unsigned iOS device IPA
        working-directory: app/ios
        env:
          NUVX_BUILD_REVISION: ${{ github.sha }}
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' mobile/project.yml | head -1)"
          bash scripts/package-ios-ipa.sh "$version"
          cd build/release
          shasum -a 256 ./*.ipa > SHA256-ios.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/ios/build/release/*.ipa
            app/ios/build/release/SHA256-ios.txt
          if-no-files-found: error
          retention-days: 7
