name: Apple builds

on:
  pull_request:
    paths:
      - 'app/ios/**'
      - 'core/apple/**'
      - 'core/native/**'
      - 'app/desktop/**'
      - '.github/workflows/apple-builds.yml'
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'core/apple/**'
      - 'core/native/**'
      - 'app/desktop/**'
      - '.github/workflows/apple-builds.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag (vX.Y.Z); run on the matching ref to upload packages'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || '' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify release ref when uploading
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Check Apple source, assets, packaging and workflow contracts
        run: |
          python3 app/ios/scripts/check-nuvx-port.py
          python3 -m unittest discover -s app/ios/tests -v
          bash -n app/ios/scripts/package-ios-ipa.sh
          bash -n app/ios/scripts/build-native-core.sh
          bash -n app/ios/scripts/build-shared-framework.sh
          sh -n app/desktop/macos/bundle.sh

  ios:
    needs: source
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/ios/native-core
          key: ios
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          command -v cmake >/dev/null || brew install cmake
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - name: Build native and KMP frameworks and generate Xcode project
        working-directory: app/ios
        env:
          CONFIG: release
        run: bash scripts/bootstrap-apple.sh
      - name: Build and package unsigned device IPA
        working-directory: app/ios
        env:
          NUVX_BUILD_REVISION: ${{ github.sha }}
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' mobile/project.yml | head -1)"
          if [[ -n "$RELEASE_TAG" ]]; then test "$RELEASE_TAG" = "v$version"; fi
          bash scripts/package-ios-ipa.sh "$version"
          cd build/release
          shasum -a 256 ./*.ipa > SHA256-ios.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: app/ios/build/release/*
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop
          key: ${{ matrix.arch }}
      - name: Test and build the Rust desktop
        run: |
          cargo test --locked --target "$ARCH-apple-darwin"
          cargo build --release --locked --target "$ARCH-apple-darwin"
      - name: Package ad-hoc signed DMG and portable ZIP
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ -n "$RELEASE_TAG" ]]; then test "$RELEASE_TAG" = "v$version"; fi
          binary="target/$ARCH-apple-darwin/release/nuvx"
          mkdir -p dist
          sh macos/bundle.sh "$binary" "$version" target/dmg
          ln -s /Applications target/dmg/Applications
          hdiutil create -volname nuvx -srcfolder target/dmg -format UDZO "dist/nuvx-setup-$version-macos-$ARCH.dmg"
          sh macos/bundle.sh "$binary" "$version" target/portable portable
          ditto -c -k --keepParent target/portable/nuvx.app "dist/nuvx-portable-$version-macos-$ARCH.zip"
          (cd dist && shasum -a 256 ./*.dmg ./*.zip > "SHA256-macos-$ARCH.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: app/desktop/dist/*
          if-no-files-found: error
          retention-days: 14

  upload-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [ios, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Upload to an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" packages/*
