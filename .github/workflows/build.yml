name: Build and test
on:
  push:
    branches: [main]
    # Canvas uploads only add videos; they don't need the app build.
    paths-ignore: ["canvas/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applications:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Prepare Windows decoder and brand icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./core/scripts/prepare-windows.ps1
      - name: Tests, Android variants, and desktop application image
        run: bash ./gradlew :excor:jvmTest :shared:desktopTest :androidApp:testMobileDebugUnitTest :androidApp:assembleDebug :androidApp:bundleRelease :androidApp:lint :desktopApp:test :desktopApp:createDistributable
      - name: Compile iOS shared framework
        if: runner.os == 'macOS'
        run: bash ./gradlew :shared:linkReleaseFrameworkIosArm64 :shared:linkReleaseFrameworkIosSimulatorArm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuvx-${{ runner.os }}
          include-hidden-files: true
          path: |
            App/androidApp/build/outputs/apk/**/debug/*.apk
            App/androidApp/build/outputs/bundle/*Release/*.aab
            App/desktopApp/build/compose/binaries/main/app/
            core/shared/build/bin/ios*/releaseFramework/
            .gradle/engines/resolved.properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ runner.os }}
          path: |
            core/shared/build/reports/
            App/androidApp/build/reports/
            App/desktopApp/build/reports/
