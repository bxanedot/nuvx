name: Nuvx releases

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/android/**"
      - "app/desktop/**"
      - "app/web/extension/**"
      - "app/web/app/public/models/**"
      - "core/**"
      - "!core/worker/**"
      - "scripts/cargo_notices.py"
      - "scripts/test_cargo_notices.py"
      - "scripts/spdx/**"
      - ".github/workflows/android-nightly.yml"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:
  # A nightly every night when main has new commits.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  # Per event: a push to main (which builds nothing) must not cancel the nightly in progress.
  group: nuvx-release-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip a night with nothing new
        id: check
        run: |
          build=true
          if [[ "${{ github.event_name }}" == schedule ]]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
              --jq '[.[] | select(.draft == false and .prerelease == true and (.tag_name | startswith("nightly.")))][0].tag_name // empty')
            if [[ -n "$last" ]] && [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/$last" --jq .sha) == "$GITHUB_SHA" ]]; then
              echo "Nightly $last already has $GITHUB_SHA; nothing new tonight"
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  prepare:
    needs: gate
    if: needs.gate.outputs.build == 'true' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version_suffix: ${{ steps.metadata.outputs.version_suffix }}
      is_stable: ${{ steps.metadata.outputs.is_stable }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      android_version: ${{ steps.metadata.outputs.android_version }}
      android_code: ${{ steps.metadata.outputs.android_code }}
      extension_version: ${{ steps.metadata.outputs.extension_version }}
      source_ref: ${{ steps.metadata.outputs.source_ref }}
      desktop_version: ${{ steps.metadata.outputs.desktop_version }}
      build_time: ${{ steps.metadata.outputs.build_time }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read release metadata
        id: metadata
        run: |
          version=$(sed -nE 's/^extra\["nuvxVersionName"\].*getOrElse\("([^"]+)"\)$/\1/p' build.gradle.kts)
          code=$(sed -nE 's/^extra\["nuvxVersionCode"\].*getOrElse\(([0-9]+)\)$/\1/p' build.gradle.kts)
          desktop_version=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' app/desktop/Cargo.toml | head -1)
          extension_version=$(node -p "require('./app/web/extension/package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $code =~ ^[1-9][0-9]*$ ]]
          [[ $desktop_version == "$version" && $extension_version == "$version" ]]
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            suffix=""
            is_stable=true
            [[ $release_tag == "v$version" ]]
            [[ $version != 0.9.0 || $code == 9 ]]
            [[ $version != 1.0.0 || $code == 1 ]]
            android_version="$version"
            android_code="$code"
          else
            release_tag="nightly.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            suffix="$release_tag"
            is_stable=false
            stable_v1=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)
            if [[ $stable_v1 == v1.0.0 ]]; then
              android_version="$version"
              android_code="$code"
              desktop_version="$version"
              extension_version="$version"
            else
              android_version=0.9.0
              android_code=9
              desktop_version=0.9.0
              # shortcut: the fourth manifest component uses the run number, capped at 65535 by Chromium; switch if CI reaches that.
              extension_version="0.9.0.$GITHUB_RUN_NUMBER"
            fi
          fi
          if [[ $is_stable == false ]]; then
            if [[ $stable_v1 == v1.0.0 ]]; then
              major=${version%%.*}
              [[ $major =~ ^[0-9]+$ && $major -ge 1 &&
                $android_version == "$version" && $android_code == "$code" &&
                $desktop_version == "$version" && $extension_version == "$version" ]] ||
                { echo "Nightly version policy mismatch after stable v1.0.0" >&2; exit 1; }
            else
              [[ $android_version == 0.9.0 && $android_code == 9 && $desktop_version == 0.9.0 && $extension_version == 0.9.0.* ]] ||
                { echo "Nightly version policy mismatch before stable v1.0.0" >&2; exit 1; }
            fi
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"
          echo "stable_version=$version" >> "$GITHUB_OUTPUT"
          echo "android_version=$android_version" >> "$GITHUB_OUTPUT"
          echo "android_code=$android_code" >> "$GITHUB_OUTPUT"
          echo "extension_version=$extension_version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$desktop_version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Create nightly draft
        if: steps.metadata.outputs.is_stable == 'false'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          STABLE_VERSION: ${{ steps.metadata.outputs.stable_version }}
          ANDROID_VERSION: ${{ steps.metadata.outputs.android_version }}
          ANDROID_CODE: ${{ steps.metadata.outputs.android_code }}
          SOURCE_REF: ${{ steps.metadata.outputs.source_ref }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true and (.tag_name | startswith("nightly."))) | .tag_name' |
            while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              gh release delete "$tag" --yes
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              fi
            done
          # Stable -> nightly 1 -> nightly 2 -> next stable: count the nightlies since the latest stable.
          since=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .published_at 2>/dev/null || echo "")
          number=$(( $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft == false and .prerelease == true and (.tag_name | startswith(\"nightly.\")) and .published_at > \"$since\") | .tag_name" | wc -l) + 1 ))
          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_REF" --draft --prerelease --latest=false \
            --title "nuvx $ANDROID_VERSION nightly $number" \
            --notes "![nuvx: Music in full color](https://raw.githubusercontent.com/lylicht/nuvx/main/docs/assets/nuvx-music-in-full-color.webp)"$'\n\n'"Nightly $number of nuvx $ANDROID_VERSION, built from main ($SOURCE_REF). Apps offer it only with Nightly updates on, and move to the next stable release when it comes out. Signed desktop installers for Windows (x64 and ARM64), macOS and Linux; one APK each for Android phone, TV, Auto and Wear; Chrome and Firefox extensions. Cast and Wear features need Google Play Services."
      - name: Create stable release draft
        if: steps.metadata.outputs.is_stable == 'true'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          STABLE_VERSION: ${{ steps.metadata.outputs.stable_version }}
          SOURCE_REF: ${{ steps.metadata.outputs.source_ref }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            [[ "$draft" == true ]]
          else
            notes=$(awk -v heading="## $STABLE_VERSION" '$0 == heading || $0 == heading " (Unreleased)" { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
            [[ -n "$notes" ]]
            # Every release opens with the nuvx picture; the apps show it in their update notes too.
            notes="![nuvx: Music in full color](https://raw.githubusercontent.com/lylicht/nuvx/main/docs/assets/nuvx-music-in-full-color.webp)"$'\n\n'"$notes"
            gh release create "$RELEASE_TAG" \
              --target "$SOURCE_REF" --draft --title "nuvx $STABLE_VERSION" --notes "$notes"
          fi

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      VERSION_SUFFIX: ${{ needs.prepare.outputs.version_suffix }}
      ANDROID_VERSION: ${{ needs.prepare.outputs.android_version }}
      ANDROID_CODE: ${{ needs.prepare.outputs.android_code }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1"
      - name: Build and verify signed APKs
        env:
          NUVX_KEYSTORE_BASE64: ${{ secrets.NUVX_KEYSTORE_BASE64 }}
          NUVX_KEYSTORE_PASSWORD: ${{ secrets.NUVX_KEYSTORE_PASSWORD }}
          NUVX_KEY_ALIAS: ${{ secrets.NUVX_KEY_ALIAS }}
          NUVX_KEY_PASSWORD: ${{ secrets.NUVX_KEY_PASSWORD }}
        run: |
          version="$ANDROID_VERSION"
          code="$ANDROID_CODE"
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $code =~ ^[1-9][0-9]*$ ]]
          suffix="$VERSION_SUFFIX"
          version_name="$version"
          [[ -z "$suffix" ]] || version_name="$version-$suffix"
          umask 077
          trap 'rm -f keystore.properties "$RUNNER_TEMP/nuvx-nightly.jks"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          key = Path(os.environ["RUNNER_TEMP"]) / "nuvx-nightly.jks"
          key.write_bytes(base64.b64decode("".join(os.environ.pop("NUVX_KEYSTORE_BASE64").split()), validate=True))
          properties = {
              "storeFile": str(key),
              "storePassword": os.environ["NUVX_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["NUVX_KEY_ALIAS"],
              "keyPassword": os.environ["NUVX_KEY_PASSWORD"],
          }
          with Path("keystore.properties").open("w", encoding="ascii") as out:
              for name, value in properties.items():
                  assert value and "\n" not in value and "\r" not in value
                  raw = value.encode("utf-16-be")
                  escaped = "".join(f"\\u{int.from_bytes(raw[i:i+2], 'big'):04x}" for i in range(0, len(raw), 2))
                  out.write(f"{name}={escaped}\n")
          PY
          unset NUVX_KEYSTORE_BASE64 NUVX_KEYSTORE_PASSWORD NUVX_KEY_ALIAS NUVX_KEY_PASSWORD
          bash gradlew :app:testProdDebugUnitTest \
            :app:assembleProdRelease :tv:assembleProdTvRelease :tv:assembleProdAutoRelease :wearos:assembleProdRelease \
            -Pnuvx.androidVersionCode="$code" -Pnuvx.androidVersionName="$version" -Pnuvx.nightlySuffix="$suffix" \
            -Pnuvx.releaseTag="$RELEASE_TAG" -Pnuvx.buildTime="$BUILD_TIME"
          mkdir nightly
          tools="$ANDROID_HOME/build-tools/37.0.0"
          stage() {
            local source=$1 prefix=$2 package=$3 metadata
            metadata=$("$tools/aapt2" dump badging "$source")
            [[ $metadata == *"package: name='$package' versionCode='$code' versionName='$version_name'"* ]] ||
              { echo "$source: expected $package $version_name ($code), got: $(grep '^package:' <<<"$metadata")" >&2; exit 1; }
            certs=$("$tools/apksigner" verify --print-certs "$source")
            grep -qF 'certificate SHA-256 digest: 833677fbdff79698cae61cca10e09622e3732cc452d4800262cc118230e0fb9c' <<<"$certs" ||
              { echo "$source is not signed with the licht key; it has: $(grep 'SHA-256 digest' <<<"$certs")" >&2; exit 1; }
            assert_android_legal_assets "$source"
            cp "$source" "nightly/$prefix-v$version${suffix:+-$suffix}.apk"
          }
          assert_android_legal_assets() {
            local apk=$1 entry
            for entry in \
              assets/licenses/README.txt \
              assets/licenses/LICENSE \
              assets/licenses/LICENSES.md \
              assets/licenses/LICENSE-AGPL-3.0.txt \
              assets/licenses/LICENSE-LGPL-3.0-only.txt \
              assets/licenses/LICENSE-LGPL-2.1.txt \
              assets/licenses/LICENSE-Apache-2.0.txt \
              assets/licenses/LICENSE-MIT-Signalsmith-Stretch.txt \
              assets/licenses/LICENSE-MIT-Signalsmith-Linear.txt \
              assets/licenses/LICENSE-MIT-Liquid-Glass-Easy.txt \
              assets/licenses/LICENSE-MIT-Model-Weights.txt \
              assets/licenses/THIRD_PARTY_NOTICES.txt; do
              unzip -Z1 "$apk" | grep -Fqx "$entry" || {
                echo "Missing Android legal asset $entry in $apk" >&2
                return 1
              }
            done
          }
          stage_android() {
            local dir=$1 variant=$2 prefix=$3 package=$4 source metadata asset
            source=$(find "$dir" -type f -path "*/$variant/release/*.apk" -print -quit)
            [[ -n "$source" && -s "$source" ]]
            metadata=$("$tools/aapt2" dump badging "$source")
            [[ $metadata == *"package: name='$package' versionCode='$code' versionName='$version_name'"* ]] ||
              { echo "$source: expected $package $version_name ($code), got: $(grep '^package:' <<<"$metadata")" >&2; exit 1; }
            certs=$("$tools/apksigner" verify --print-certs "$source")
            grep -qF 'certificate SHA-256 digest: 833677fbdff79698cae61cca10e09622e3732cc452d4800262cc118230e0fb9c' <<<"$certs" ||
              { echo "$source is not signed with the licht key; it has: $(grep 'SHA-256 digest' <<<"$certs")" >&2; exit 1; }
            assert_android_legal_assets "$source"
            for abi in armeabi-v7a arm64-v8a x86_64; do
              unzip -l "$source" | grep -F "lib/$abi/libonnxruntime.so"
            done
            asset="${prefix}-v${version}${suffix:+-$suffix}"
            cp "$source" "nightly/${asset}.apk"
          }
          stage_android app/android/mobile/build/outputs/apk prod nuvx com.licht.nuvx
          stage_android app/android/tv/build/outputs/apk prodTv NuvxTV com.licht.nuvx.tv
          stage_android app/android/tv/build/outputs/apk prodAuto NuvxAuto com.licht.nuvx.auto
          stage app/android/wearos/build/outputs/apk/prod/release/NuvxWear-prod-release.apk NuvxWear com.licht.nuvx
          [[ $(find nightly -maxdepth 1 -name '*.apk' | wc -l) -eq 4 ]]
          (cd nightly && sha256sum ./*.apk | sed 's|  ./|  |' > SHA256SUMS)
          gh release upload "$RELEASE_TAG" nightly/*.apk nightly/SHA256SUMS --clobber

  cargo-notices:
    needs: prepare
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate locked Cargo dependency notices
        run: |
          python3 ../../scripts/test_cargo_notices.py
          python3 ../../scripts/cargo_notices.py --output assets/licenses/cargo-notices.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses/cargo-notices.txt
          if-no-files-found: error

  windows-build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      VERSION_SUFFIX: ${{ needs.prepare.outputs.version_suffix }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          update_version="$DESKTOP_VERSION"
          [[ -z "$VERSION_SUFFIX" ]] || update_version="$DESKTOP_VERSION-$VERSION_SUFFIX"
          NUVX_UPDATE_VERSION="$update_version" NUVX_RELEASE_TAG="$RELEASE_TAG" NUVX_BUILD_TIME="$BUILD_TIME" \
            cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx.exe" "universal/${{ matrix.arch }}/nuvx.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: nuvx-windows-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  windows:
    needs: [prepare, windows-build, cargo-notices]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      IS_STABLE: ${{ needs.prepare.outputs.is_stable }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-windows-x86_64
          path: app/desktop/target/x86_64-pc-windows-msvc/release
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-windows-aarch64
          path: app/desktop/target/aarch64-pc-windows-msvc/release
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses
      - name: Check Cargo notice artifact
        timeout-minutes: 5
        run: test -s assets/licenses/cargo-notices.txt
      - name: Install Inno Setup
        timeout-minutes: 15
        run: choco install innosetup --no-progress -y
      - name: Compile universal installer
        timeout-minutes: 30
        run: MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$DESKTOP_VERSION" windows/nuvx.iss
      - name: Verify bundled Cargo notices
        timeout-minutes: 20
        run: |
          installer="windows/Output/nuvx-setup-$DESKTOP_VERSION.exe"
          install_dir="$RUNNER_TEMP/nuvx-notice-test"
          MSYS2_ARG_CONV_EXCL="*" "$installer" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=$install_dir"
          test -s "$install_dir/licenses/cargo-notices.txt"
          cmp assets/licenses/cargo-notices.txt "$install_dir/licenses/cargo-notices.txt"
      - name: Upload Windows installer
        timeout-minutes: 15
        run: |
          if [[ "$IS_STABLE" == true ]]; then
            installer="nuvx-setup-$DESKTOP_VERSION.exe"
          else
            installer="nuvx-setup-$RELEASE_TAG.exe"
          fi
          mv "windows/Output/nuvx-setup-$DESKTOP_VERSION.exe" "$installer"
          gh release upload "$RELEASE_TAG" "$installer" --clobber
  linux-build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      VERSION_SUFFIX: ${{ needs.prepare.outputs.version_suffix }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          update_version="$DESKTOP_VERSION"
          [[ -z "$VERSION_SUFFIX" ]] || update_version="$DESKTOP_VERSION-$VERSION_SUFFIX"
          NUVX_UPDATE_VERSION="$update_version" NUVX_RELEASE_TAG="$RELEASE_TAG" NUVX_BUILD_TIME="$BUILD_TIME" \
            cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx" "universal/${{ matrix.arch }}/nuvx"
      - uses: actions/upload-artifact@v7
        with:
          name: nuvx-linux-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  linux:
    needs: [prepare, linux-build, cargo-notices]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      IS_STABLE: ${{ needs.prepare.outputs.is_stable }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-linux-x86_64
          path: app/desktop/universal/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-linux-aarch64
          path: app/desktop/universal/aarch64
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses
      - name: Package and upload installer
        run: |
          test -s assets/licenses/cargo-notices.txt
          mkdir -p dist/nuvx
          cp universal/x86_64/nuvx dist/nuvx/nuvx-x86_64
          cp universal/aarch64/nuvx dist/nuvx/nuvx-aarch64
          cp linux/install.sh linux/nuvx.desktop README.md LICENSE dist/nuvx/
          mkdir -p dist/nuvx/licenses
          cp assets/fonts/LICENSE-*.txt dist/nuvx/licenses/
          cp assets/licenses/*.txt dist/nuvx/licenses/
          cp vendor/glib/LICENSE dist/nuvx/licenses/glib-LICENSE.txt
          cp vendor/glib/COPYRIGHT dist/nuvx/licenses/glib-COPYRIGHT.txt
          cp assets/icon/icon.png dist/nuvx/nuvx.png
          chmod 755 dist/nuvx/nuvx-x86_64 dist/nuvx/nuvx-aarch64 dist/nuvx/install.sh
          sh linux/test-installer.sh dist/nuvx
          if [[ "$IS_STABLE" == true ]]; then
            installer="nuvx-setup-$DESKTOP_VERSION-linux-universal.tar.gz"
          else
            installer="nuvx-setup-$RELEASE_TAG-linux-universal.tar.gz"
          fi
          tar -C dist -cf - nuvx | gzip -9 > "$installer"
          gh release upload "$RELEASE_TAG" "$installer" --clobber

  macos-build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      VERSION_SUFFIX: ${{ needs.prepare.outputs.version_suffix }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/desktop, key: "${{ matrix.arch }}" }
      - run: |
          update_version="$DESKTOP_VERSION"
          [[ -z "$VERSION_SUFFIX" ]] || update_version="$DESKTOP_VERSION-$VERSION_SUFFIX"
          NUVX_UPDATE_VERSION="$update_version" NUVX_RELEASE_TAG="$RELEASE_TAG" NUVX_BUILD_TIME="$BUILD_TIME" \
            cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p "universal/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nuvx" "universal/${{ matrix.arch }}/nuvx"
      - uses: actions/upload-artifact@v7
        with:
          name: nuvx-macos-${{ matrix.arch }}
          path: app/desktop/universal/${{ matrix.arch }}
          if-no-files-found: error

  macos:
    needs: [prepare, macos-build, cargo-notices]
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      IS_STABLE: ${{ needs.prepare.outputs.is_stable }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-macos-x86_64
          path: app/desktop/universal/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-macos-aarch64
          path: app/desktop/universal/aarch64
      - uses: actions/download-artifact@v8
        with:
          name: nuvx-cargo-notices
          path: app/desktop/assets/licenses
      - name: Package and upload macOS installers
        run: |
          test -s assets/licenses/cargo-notices.txt
          mkdir -p universal
          asset_version="$DESKTOP_VERSION"
          [[ "$IS_STABLE" == true ]] || asset_version="$RELEASE_TAG"
          lipo -create universal/aarch64/nuvx universal/x86_64/nuvx -output universal/nuvx
          lipo universal/nuvx -verify_arch x86_64 arm64
          folder=dmg-universal
          sh macos/bundle.sh universal/nuvx "$DESKTOP_VERSION" "$folder"
          ln -s /Applications "$folder/Applications"
          installer="nuvx-setup-$asset_version-macos-universal.dmg"
          hdiutil create -volname nuvx -srcfolder "$folder" -format UDZO "$installer"
          gh release upload "$RELEASE_TAG" "$installer" --clobber

  extensions:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      EXTENSION_VERSION: ${{ needs.prepare.outputs.extension_version }}
      IS_STABLE: ${{ needs.prepare.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml
      - run: pnpm --dir app/web install --frozen-lockfile
      - name: Build Chrome and Firefox packages
        env:
          NUVX_SITE_ORIGINS: https://web.nuvx.lol,https://nuvx.pages.dev
          NUVX_MANIFEST_VERSION: ${{ needs.prepare.outputs.extension_version }}
        run: pnpm --dir app/web/extension package
      - name: Upload browser extensions
        run: |
          node --input-type=module <<'JS'
          import { copyFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const downloads = 'app/web/app/public/downloads';
          const output = process.env.RUNNER_TEMP;
          const manifest = JSON.parse(readFileSync(join(downloads, 'extension.json'), 'utf8'));
          if (manifest.version !== process.env.EXTENSION_VERSION) throw new Error(`Unexpected extension version ${manifest.version}`);
          const assetVersion = process.env.IS_STABLE === 'true' ? manifest.version : process.env.RELEASE_TAG;
          for (const browser of ['chrome', 'firefox']) {
            const name = `nuvx-extension-${browser}-${assetVersion}.zip`;
            copyFileSync(join(downloads, manifest.files[browser]), join(output, name));
          }
          copyFileSync(join(downloads, 'extension.json'), join(output, 'extension.json'));
          JS
          asset_version="$EXTENSION_VERSION"
          [[ "$IS_STABLE" == true ]] || asset_version="$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/nuvx-extension-chrome-$asset_version.zip" \
            "$RUNNER_TEMP/nuvx-extension-firefox-$asset_version.zip" \
            "$RUNNER_TEMP/extension.json" --clobber

  publish:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, cargo-notices, android, windows, linux, macos, extensions]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      IS_STABLE: ${{ needs.prepare.outputs.is_stable }}
      ANDROID_VERSION: ${{ needs.prepare.outputs.android_version }}
      SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
    steps:
      - name: Publish nightly and prune older builds
        run: |
          if [[ "${{ needs.cargo-notices.result }}" != success || "${{ needs.android.result }}" != success || "${{ needs.windows.result }}" != success || "${{ needs.linux.result }}" != success || "${{ needs.macos.result }}" != success || "${{ needs.extensions.result }}" != success ]]; then
            if [[ "$IS_STABLE" == true ]]; then
              gh release delete "$RELEASE_TAG" --yes || true
              exit 1
            fi
            echo "A platform build failed; removing incomplete nightly $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
            exit 0
          fi
          if [[ "$IS_STABLE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
            exit 0
          fi
          stable_v1=$(gh api "repos/$GH_REPO/releases/tags/v1.0.0" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)
          if [[ $stable_v1 == v1.0.0 && $ANDROID_VERSION == 0.9.0 ]]; then
            echo "Discarding obsolete 0.9.0 nightly $RELEASE_TAG because stable v1.0.0 is published"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
            exit 0
          fi
          # A finished nightly is published even if main moved on meanwhile; the next night builds the newer commit.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          # Keep this cycle's nightlies (since the latest stable); remove the ones from before it.
          since=$(gh api "repos/$GH_REPO/releases/latest" --jq .published_at 2>/dev/null || echo "")
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.prerelease == true and .draft == false and (.tag_name | startswith(\"nightly.\")) and .published_at < \"$since\") | .tag_name" |
            while IFS= read -r tag; do
              [[ -z "$tag" || "$tag" == "$RELEASE_TAG" ]] || gh release delete "$tag" --yes --cleanup-tag
            done
