version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /app/desktop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /core/worker
    schedule:
      interval: weekly
