<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nuvx canvas</title>
<meta name="description" content="Upload a community canvas: a short looping video that plays over a song's cover in nuvx.">
<link rel="icon" href="https://nuvx.lol/mark-white.svg">
<link rel="stylesheet" href="https://www.nuvx.lol/ambient.css">
<script>
  (() => {
    try {
      const theme = localStorage.getItem('nuvx-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      document.documentElement.toggleAttribute('data-motion-paused', localStorage.getItem('nuvx-motion') === 'paused');
    } catch {}
  })();
</script>
<style>
  :root { color-scheme: dark; --bg: #080808; --card: #111; --card-hover: #1b1b1b; --line: #333; --text: #f5f5f5; --dim: #aaa; --accent: #f5f5f5; --accent-foreground: #080808; accent-color: var(--accent); }
  :root[data-theme="light"] { color-scheme: light; --bg: #fafafa; --card: #f1f1f1; --card-hover: #e7e7e7; --line: #d8d8d8; --text: #111; --dim: #626262; --accent: #111; --accent-foreground: #fafafa; }
  * { box-sizing: border-box; }
  body { position: relative; isolation: isolate; min-height: 100svh; margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 44px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header img { width: 44px; height: auto; }
  :root[data-theme="light"] header img { filter: brightness(0); }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.02em; }
  .theme-toggle { margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--text); cursor: pointer; }
  .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon-sun { display: none; }
  :root[data-theme="light"] .icon-sun { display: block; }
  :root[data-theme="light"] .icon-moon { display: none; }
  p.lead { color: var(--dim); margin: 0 0 24px; }
  label.field { display: block; font-weight: 600; margin: 18px 0 8px; }
  input[type=url], input[type=password] { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
  input:focus-visible, .drop:focus-within, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--dim); font-size: 14px; margin-top: 6px; min-height: 20px; }
  .drop { display: grid; place-items: center; gap: 10px; text-align: center; min-height: 180px; padding: 20px; border: 2px dashed var(--line); border-radius: 20px; background: var(--card); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--card-hover); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop video { width: 160px; height: 160px; object-fit: cover; border-radius: 14px; display: none; }
  .drop strong { font-size: 18px; }
  #send, #retryIndex { width: 100%; margin-top: 24px; padding: 15px; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent); color: var(--accent-foreground); font: 600 17px system-ui, sans-serif; cursor: pointer; }
  #retryIndex { margin-top: 8px; background: transparent; color: var(--text); }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { margin-top: 16px; min-height: 24px; }
  #status.good, #status.bad, .hint.bad { color: var(--dim); }
  footer { margin-top: 40px; color: var(--dim); font-size: 14px; }
  a { color: var(--accent); }
  .licht-signature-corner { position: fixed; z-index: 2; top: 20px; right: 24px; color: var(--dim); font: italic 600 15px/1 system-ui, sans-serif; letter-spacing: -.04em; text-decoration: none; }
  .licht-signature-corner:hover { color: var(--text); }
  @media (max-width: 620px) { main { padding-top: 76px; } .licht-signature-corner { top: 18px; right: 18px; } }
</style>
</head>
<body>
<a class="licht-signature-corner" href="https://guns.lol/lylicht" target="_blank" rel="noopener noreferrer" aria-label="licht on Guns.lol">licht</a>
<div class="nuvx-ambient" aria-hidden="true"></div>
<main>
  <header><img src="https://nuvx.lol/mark-white.svg" alt=""><h1>nuvx canvas</h1><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode"><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.6 8.6 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l-1.42 1.42m11.3-11.3 1.42-1.42"/></svg></button></header>
  <label class="ambient-pause"><input id="ambient-pause" type="checkbox"> Pause background motion</label>
  <p class="lead">Add a looping video that plays over a song's cover in nuvx.</p>

  <form id="form">
    <label class="field" for="link">Song link</label>
    <input id="link" name="link" type="url" inputmode="url" autocomplete="off" placeholder="https://music.youtube.com/watch?v=…" required>
    <div id="linkHint" class="hint" aria-live="polite">In YouTube Music: Share → Copy link, then paste it here.</div>

    <label class="field" for="video">Video</label>
    <label class="drop" id="drop">
      <input id="video" name="video" type="file" accept="video/mp4" required>
      <video id="preview" muted loop playsinline autoplay></video>
      <strong id="dropTitle">Drop an MP4 here</strong>
      <span class="hint" id="dropHint">or tap to choose one · up to 10 MB, a few seconds that loop</span>
    </label>

    <label class="field" for="passcode">Upload passcode</label>
    <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>

    <button id="send" type="submit" disabled>Upload canvas</button>
    <button id="retryIndex" type="button" hidden>Retry sharing</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <footer>Only upload videos you have the right to share. Files are stored publicly in <a href="https://github.com/lylicht/nuvx/tree/main/canvas">the nuvx repository</a>.</footer>
</main>
<script>
  const UPLOAD = "https://nuvx-listen.lylicht.workers.dev/canvas";
  const MAX = 10 * 1024 * 1024;
  const $ = (id) => document.getElementById(id);
  const form = $("form"), link = $("link"), video = $("video"), drop = $("drop"), pass = $("passcode"), send = $("send"), retryIndex = $("retryIndex"), status = $("status");
  const root = document.documentElement;
  const themeToggle = $("theme-toggle");
  const ambient = document.querySelector(".nuvx-ambient");
  const ambientPause = $("ambient-pause");
  ambientPause.checked = root.hasAttribute("data-motion-paused");
  ambient.toggleAttribute("data-motion-paused", ambientPause.checked);
  let file = null;
  let pendingIndexId = null;

  themeToggle.addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    themeToggle.setAttribute("aria-label", `Switch to ${root.dataset.theme === "dark" ? "light" : "dark"} mode`);
    try { localStorage.setItem("nuvx-theme", root.dataset.theme); } catch {}
  });
  themeToggle.setAttribute("aria-label", `Switch to ${root.dataset.theme === "dark" ? "light" : "dark"} mode`);
  ambientPause.addEventListener("change", () => ambient.toggleAttribute("data-motion-paused", ambientPause.checked));

  function idFrom(text) {
    text = text.trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(text)) return text;
    try {
      const u = new URL(text), host = u.hostname.replace(/^www\./, "");
      const id = host === "youtu.be" ? u.pathname.slice(1) : ["music.youtube.com", "youtube.com", "m.youtube.com"].includes(host) ? u.searchParams.get("v") : null;
      return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
    } catch { return null; }
  }
  function refresh() {
    const id = idFrom(link.value);
    $("linkHint").textContent = link.value.trim() === "" ? "In YouTube Music: Share → Copy link, then paste it here." : id ? `Song id ${id} · saved as ${id}.mp4` : "That isn't a YouTube Music song link.";
    $("linkHint").className = "hint" + (link.value.trim() && !id ? " bad" : "");
    send.disabled = !(id && file && pass.value);
  }
  function choose(f) {
    if (!f) return;
    if (f.type && f.type !== "video/mp4") { $("dropHint").textContent = "That isn't an MP4."; file = null; return refresh(); }
    if (f.size > MAX) { $("dropHint").textContent = `That's ${(f.size / 1048576).toFixed(1)} MB; the limit is 10 MB.`; file = null; return refresh(); }
    file = f;
    $("dropTitle").textContent = f.name;
    $("dropHint").textContent = `${(f.size / 1048576).toFixed(1)} MB · tap to change`;
    const p = $("preview"); p.src = URL.createObjectURL(f); p.style.display = "block";
    refresh();
  }
  video.addEventListener("change", () => choose(video.files[0]));
  ["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (ev) => choose(ev.dataTransfer.files[0]));
  link.addEventListener("input", refresh);
  pass.addEventListener("input", refresh);
  try { pass.value = localStorage.getItem("nuvxCanvasPasscode") || ""; } catch {}
  refresh();

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = idFrom(link.value);
    if (!id || !file) return;
    pendingIndexId = null; retryIndex.hidden = true;
    send.disabled = true; status.className = ""; status.textContent = "Uploading…";
    const body = new FormData();
    body.append("link", id); body.append("passcode", pass.value); body.append("video", file, `${id}.mp4`);
    try {
      const res = await fetch(UPLOAD, { method: "POST", body });
      const out = await res.json().catch(() => ({}));
      if (out.uploaded && !out.shared) {
        try { localStorage.setItem("nuvxCanvasPasscode", pass.value); } catch {}
        pendingIndexId = id; retryIndex.hidden = false;
        status.className = "bad";
        status.textContent = `The canvas for ${id} was uploaded, but sharing failed. Retry sharing without uploading again.`;
        return;
      }
      if (!res.ok) throw new Error(out.error || `Upload failed (${res.status}).`);
      try { localStorage.setItem("nuvxCanvasPasscode", pass.value); } catch {}
      status.className = "good";
      status.textContent = `Added the canvas for ${id}. It also plays on other copies of the song.`;
    } catch (e) {
      status.className = "bad"; status.textContent = e.message;
    } finally { refresh(); }
  });

  retryIndex.addEventListener("click", async () => {
    if (!pendingIndexId) return;
    retryIndex.disabled = true; status.className = ""; status.textContent = "Retrying sharing…";
    const body = new FormData();
    body.append("action", "share"); body.append("link", pendingIndexId); body.append("passcode", pass.value);
    try {
      const res = await fetch(UPLOAD, { method: "POST", body });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || `Sharing failed (${res.status}).`);
      pendingIndexId = null; retryIndex.hidden = true;
      status.className = "good"; status.textContent = `Canvas shared for ${body.get("link")}. It also plays on other copies of the song.`;
    } catch (e) {
      status.className = "bad"; status.textContent = e.message;
    } finally { retryIndex.disabled = false; }
  });
</script>
</body>
</html>
